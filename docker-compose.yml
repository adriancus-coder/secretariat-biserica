# PostgreSQL pentru dezvoltare locală:  docker compose up -d
# Creează baza `secretariat` (aplicația) și `secretariat_test` (testele de integrare).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: secretariat
      POSTGRES_PASSWORD: secretariat
      POSTGRES_DB: secretariat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretariat -d secretariat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
