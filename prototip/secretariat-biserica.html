<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secretariat Biserică</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#FBFAF6; --ink:#1E2436; --ink-2:#4C5468; --ink-3:#8A90A0;
  --line:#E2DFD6; --field:#FFFFFF; --panel:#F2F0E9;
  --navy:#243458; --navy-2:#1B2843; --gold:#B58A2B; --gold-soft:#F3E9CF;
  --ok:#2F6B4F; --ok-soft:#E1EFE6; --warn:#9B4B2E; --warn-soft:#F6E3DB;
  --shadow:0 12px 30px rgba(30,36,54,.14);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#171A24; --ink:#EDEAE1; --ink-2:#B7B5AC; --ink-3:#7C7F8C;
  --line:#2C3140; --field:#1E2230; --panel:#1C202C;
  --navy:#2E4272; --navy-2:#243458; --gold:#D2A44A; --gold-soft:#3A3120;
  --ok:#7FC49F; --ok-soft:#1E3128; --warn:#E39A7B; --warn-soft:#3A2620;
  --shadow:0 12px 30px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --paper:#171A24; --ink:#EDEAE1; --ink-2:#B7B5AC; --ink-3:#7C7F8C;
  --line:#2C3140; --field:#1E2230; --panel:#1C202C;
  --navy:#2E4272; --navy-2:#243458; --gold:#D2A44A; --gold-soft:#3A3120;
  --ok:#7FC49F; --ok-soft:#1E3128; --warn:#E39A7B; --warn-soft:#3A2620;
  --shadow:0 12px 30px rgba(0,0,0,.5);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Layout */
.app{display:flex;flex-direction:column;min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy-2);color:#F4F1E8;padding:14px 18px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top .church{font-size:13px;letter-spacing:.01em;opacity:.8;margin-bottom:2px}
.top h1{font-size:24px;color:#fff}
.top .mode{font-size:12px;opacity:.7;text-align:right;white-space:nowrap}
.main{flex:1;padding:16px 16px 96px;max-width:960px;width:100%;margin:0 auto}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);display:flex;padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;background:none;border:0;padding:6px 2px;border-radius:10px;font-size:11.5px;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--navy);font-weight:600}
:root[data-theme="dark"] .nav button.on,:root:not([data-theme="light"]) .nav button.on{color:var(--gold)}
@media (min-width:820px){
  .app{flex-direction:row;min-height:100%}
  .top{position:static;flex-direction:column;align-items:stretch;justify-content:flex-start;width:220px;min-height:100vh;padding:26px 20px}
  .top .mode{text-align:left;margin-top:auto;padding-top:20px}
  .nav{position:static;flex-direction:column;background:var(--navy-2);border:0;padding:16px 12px;width:220px;margin-left:-220px;order:-1;justify-content:flex-start;gap:4px}
  .nav button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:10px;font-size:14px;color:#C9CDD9;padding:9px 10px}
  .nav button.on{background:rgba(255,255,255,.1);color:#fff!important}
  .navwrap{display:flex;flex-direction:column;width:220px;flex:0 0 220px;background:var(--navy-2)}
  .navwrap .top{min-height:0;flex:0 0 auto;padding-bottom:6px}
  .navwrap .nav{margin:0;width:auto;flex:1}
  .navwrap .mode{padding:0 20px 20px;color:#F4F1E8;font-size:12px;opacity:.7}
  .main{padding:32px 36px 60px;max-width:1000px}
}

.nav .more-only{display:none}
@media (min-width:820px){.nav .more-only{display:flex}.nav .mobile-only{display:none}}
.moremenu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.moremenu button{background:var(--panel);border:0;border-radius:12px;padding:18px 12px;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.moremenu button svg{width:26px;height:26px;stroke:var(--navy);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.segs{display:flex;gap:4px;background:var(--panel);border-radius:10px;padding:4px;margin-bottom:14px}
.segs button{flex:1;border:0;background:none;padding:7px 4px;border-radius:8px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.segs button.on{background:var(--field);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:14px}
.cal .wd{font-size:11px;color:var(--ink-3);text-align:center;padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:9px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;border:0;cursor:pointer;color:var(--ink);position:relative;padding:0}
.cal .d.out{opacity:.35}
.cal .d.today{outline:2px solid var(--gold);outline-offset:-2px}
.cal .d.sel{background:var(--navy);color:#fff}
.cal .d i{position:absolute;bottom:5px;display:flex;gap:2px}
.cal .d i b{width:5px;height:5px;border-radius:50%;background:var(--gold);display:block}
.cal .d.sel i b{background:#fff}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead h3{font-size:18px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:70px 1fr 34px;align-items:center;gap:8px;font-size:13px}
.bar div{height:10px;background:var(--panel);border-radius:5px;overflow:hidden}
.bar div span{display:block;height:100%;background:var(--navy);border-radius:5px}
.bar em{font-style:normal;text-align:right;color:var(--ink-3)}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;background:var(--gold-soft);color:var(--gold);margin:2px 4px 2px 0}
.two{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:820px){.two{grid-template-columns:1fr 1fr}}
/* Section head */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.head h2{font-size:26px}
.head .sub{color:var(--ink-3);font-size:13px;margin-top:2px}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.toolbar input,.toolbar select{flex:1;min-width:140px}

/* Controls */
.btn{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1E1A0E}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:5px;font-weight:500}
.f{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.check input{width:20px;height:20px;margin:0}
.checklist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--field)}

/* Lists */
.list{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;width:100%;border-left:0;border-right:0;text-align:left}
.item:hover{background:var(--panel)}
.item .av{width:40px;height:40px;border-radius:50%;background:var(--gold-soft);color:var(--gold);font-family:var(--serif);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;flex:0 0 40px}
.item .date{width:52px;flex:0 0 52px;text-align:center;border-right:2px solid var(--gold);padding-right:8px;font-family:var(--serif);line-height:1.05}
.item .date b{display:block;font-size:22px;font-weight:600}
.item .date span{font-size:11px;color:var(--ink-3);letter-spacing:.02em}
.item .body{flex:1;min-width:0}
.item .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--panel);color:var(--ink-2);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.letter{font-family:var(--serif);color:var(--gold);font-size:14px;padding:14px 4px 4px;font-weight:600}
.empty{padding:40px 16px;text-align:center;color:var(--ink-3)}
.empty h3{color:var(--ink);font-size:20px;margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--panel);border-radius:12px;padding:10px 12px}
.stat b{font-family:var(--serif);font-size:24px;display:block;line-height:1}
.stat span{font-size:12px;color:var(--ink-3)}
.card{background:var(--panel);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card h3{font-size:17px;margin-bottom:6px}

/* Sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(20,24,36,.45);z-index:40;display:none}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;top:8vh;background:var(--paper);border-radius:18px 18px 0 0;z-index:50;display:none;flex-direction:column;box-shadow:var(--shadow)}
.sheet.open{display:flex}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.sheet .sh h2{font-size:20px}
.sheet .sc{flex:1;overflow:auto;padding:16px 18px 24px}
.sheet .sf{display:flex;gap:8px;padding:12px 18px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--paper);flex-wrap:wrap}
.sheet .sf .spacer{flex:1}
@media (min-width:820px){
  .sheet{left:50%;right:auto;top:6vh;bottom:6vh;width:640px;transform:translateX(-50%);border-radius:16px}
}
.detail dt{font-size:12px;color:var(--ink-3);margin-top:10px}
.detail dd{margin:0;font-size:16px}
.contrib{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.contrib input{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;display:none}
.toast.show{display:block}
.hint{font-size:13px;color:var(--ink-3);margin-top:4px}

/* Print */
#print{display:none}
@media print{
  :root{padding:0}
  body{background:#fff;color:#000}
  .app,.sheet,.sheet-bg,.toast{display:none!important}
  #print{display:block;font-family:"Source Serif 4",Georgia,serif;font-size:13pt;line-height:1.55;color:#000;padding:0}
  #print .letterhead{border-bottom:2px solid #000;padding-bottom:8pt;margin-bottom:24pt}
  #print .letterhead h1{font-size:18pt;margin:0}
  #print .letterhead div{font-size:10.5pt;color:#333}
  #print .nr{text-align:right;margin-bottom:18pt}
  #print h2{text-align:center;font-size:17pt;margin:0 0 18pt;text-transform:uppercase;letter-spacing:.06em}
  #print p{margin:0 0 10pt;text-align:justify}
  #print .sig{display:flex;justify-content:space-between;margin-top:48pt}
  #print .sig div{width:45%;text-align:center}
  #print .sig div span{display:block;border-top:1px solid #000;margin-top:36pt;padding-top:4pt;font-size:11pt}
  #print ul{padding-left:18pt}
  #print .pre{white-space:pre-wrap}
  @page{margin:22mm 20mm}
}
</style>
</head>
<body>
<div class="app">
  <div class="navwrap">
    <header class="top">
      <div>
        <div class="church" id="hChurch">Biserica</div>
        <h1 id="hTitle">Secretariat</h1>
      </div>
      <div class="mode" id="hMode"></div>
    </header>
    <nav class="nav" id="nav">
      <button data-v="acasa"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Acasă</button>
      <button data-v="membri"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.7"/><path d="M15.5 14.5a5 5 0 0 1 6 5"/></svg>Persoane</button>
      <button data-v="evenimente"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
      <button data-v="sedinte"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h6M9 16h6"/></svg>Ședințe</button>
      <button data-v="documente" class="more-only"><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5z"/><path d="M9 9h2M9 13h6M9 17h6"/></svg>Documente</button>
      <button data-v="grupuri" class="more-only"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"/><circle cx="5" cy="10" r="2.3"/><circle cx="19" cy="10" r="2.3"/><path d="M7 20a5 5 0 0 1 10 0M1.5 18a3.5 3.5 0 0 1 5-3M22.5 18a3.5 3.5 0 0 0-5-3"/></svg>Grupuri</button>
      <button data-v="mentiuni" class="more-only"><svg viewBox="0 0 24 24"><path d="M4 4h16v12l-4 4H4z"/><path d="M16 20v-4h4M8 9h8M8 13h5"/></svg>Mențiuni</button>
      <button data-v="setari" class="more-only"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Setări</button>
      <button id="moreBtn" class="mobile-only"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Mai mult</button>
    </nav>
  </div>
  <main class="main" id="main"></main>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sh"><h2 id="sheetTitle"></h2><button class="btn ghost sm" id="sheetClose">Închide</button></div>
  <div class="sc" id="sheetBody"></div>
  <div class="sf" id="sheetFoot"></div>
</div>
<div class="toast" id="toast"></div>
<div id="print"></div>

<script>
/* ---------- Utilities ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const MONTHS=['ian','feb','mar','apr','mai','iun','iul','aug','sept','oct','nov','dec'];
const MONTHS_L=['ianuarie','februarie','martie','aprilie','mai','iunie','iulie','august','septembrie','octombrie','noiembrie','decembrie'];
const fmt=d=>{if(!d)return'—';const [y,m,dd]=d.split('-');return `${+dd} ${MONTHS[+m-1]} ${y}`};
const fmtL=d=>{if(!d)return'____________';const [y,m,dd]=d.split('-');return `${+dd} ${MONTHS_L[+m-1]} ${y}`};
const age=d=>{if(!d)return null;const b=new Date(d),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
const val=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
let toastT;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)};

/* ---------- Store: db capability, or localStorage fallback ---------- */
const COLS=['members','meetings','events','documents','groups','notes'];
const S={members:{},meetings:{},events:{},documents:{},groups:{},notes:{},settings:{}};
let db=null, dbReady=false, canWrite=true;
const LS='secretariat-biserica-v1';

function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'{}');for(const c of COLS)S[c]=j[c]||{};S.settings=j.settings||{}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
async function put(col,id,data){
  data={...data,id};
  if(db){try{await db.collection(col).doc(id).set(data)}catch(e){if(e&&e.code==='quota_exceeded')toast('Baza de date e plină — ștergeți înregistrări vechi.');else if(e&&e.code==='invalid_argument'){canWrite=false;toast('Nu aveți drept de scriere aici.')}else toast('Salvarea a eșuat, încercați din nou.');throw e}}
  S[col][id]=data; if(!db)saveLocal(); render();
}
async function del(col,id){
  if(db){try{await db.collection(col).doc(id).delete()}catch(e){toast('Ștergerea a eșuat.');throw e}}
  delete S[col][id]; if(!db)saveLocal(); render();
}
async function putSettings(data){
  if(db){try{await db.doc('settings/church').set(data)}catch(e){toast('Salvarea a eșuat.');throw e}}
  S.settings=data; if(!db)saveLocal(); render();
}
async function initStore(){
  loadLocal();
  render();
  try{db=await claude.use('db')}catch(e){db=null}
  if(!db){$('#hMode').textContent='Date salvate doar pe acest dispozitiv';return}
  try{
    const user=await claude.use('user');
    if(user){const w=await user.can('data.write');if(w===false)canWrite=false}
  }catch(e){}
  for(const c of COLS){
    db.collection(c).onSnapshot(snap=>{
      const o={};snap.docs.forEach(d=>{if(d.exists)o[d.id]={...d.data(),id:d.id}});
      S[c]=o;dbReady=true;render();
    },err=>{toast('Conexiune la date întreruptă.')});
  }
  db.doc('settings/church').onSnapshot(snap=>{S.settings=snap.exists?snap.data():{};render()},()=>{});
  $('#hMode').textContent=canWrite?'Date partajate — sincronizate':'Doar vizualizare';
}

/* ---------- Constants & nomenclatoare ---------- */
const STATUS=['Membru','Aparținător','Prieten','Copil','Fost membru'];
const INTRARE=['Botez','Transfer','Născut în biserică','Reprimire','Altul'];
const IESIRE=['Transfer','Retragere','Deces','Excludere','Altul'];
const NOMEN_DEF={
  tipuriSedinte:['Comitet','Adunare generală','Frați slujitori','Diaconie','Altele'],
  tipuriEvenimente:['Serviciu divin','Evanghelizare','Botez','Binecuvântare copil','Ordinare','Agapă','Conferință','Tineret','Nuntă','Înmormântare','Altele'],
  tipuriMentiuni:['Generală','Pastorală','Disciplină','Familie','Slujire','Altele'],
  rudenie:['Cap de familie','Soție','Fiu','Fiică','Părinte','Altul']
};
const nomen=k=>(S.settings.nomen&&S.settings.nomen[k]&&S.settings.nomen[k].length)?S.settings.nomen[k]:NOMEN_DEF[k];
const DTYPES={
  adeverinta:'Adeverință de membru',
  botez:'Certificat de botez',
  binecuvantare:'Certificat de binecuvântare a copilului',
  recomandare:'Scrisoare de recomandare (transfer)',
  scrisoare:'Scrisoare / adresă oficială',
  raport:'Dare de seamă anuală'
};

/* ---------- Navigation ---------- */

/* ---------- Statistics ---------- */
function stats(year){
  const y=year||+today().slice(0,4);
  const endDate=year&&year<+today().slice(0,4)?`${year}-12-31`:today();
  const all=Object.values(S.members);
  // status "as of" end of year: a person is a member at that date if they entered by then and did not exit before
  const isActive=p=>(!p.dataIesire||p.dataIesire>endDate)&&(!p.dataMembru||p.dataMembru<=endDate)&&(!p.createdAt||p.createdAt<=endDate||!year);
  const ageAt=p=>{if(!p.dataNasterii)return null;const b=new Date(p.dataNasterii),n=new Date(endDate);let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
  const minor=p=>{const a=ageAt(p);return a!==null?a<18:p.statut==='Copil'};
  const ev=all.filter(isActive);
  const membri=ev.filter(p=>p.statut==='Membru'||(p.statut==='Fost membru'&&p.dataIesire>endDate));
  const memberFams=new Set(membri.map(p=>p.familie).filter(Boolean));
  const copii=ev.filter(minor);
  const copiiMembri=copii.filter(p=>p.familie&&memberFams.has(p.familie));
  const apart=ev.filter(p=>p.statut==='Aparținător');
  const prieteni=ev.filter(p=>p.statut==='Prieten');
  const botezati=ev.filter(p=>p.dataBotez&&p.dataBotez<=endDate);
  const intrTransfer=all.filter(p=>p.modIntrare==='Transfer'&&inYear(p.dataMembru,y));
  const intrBotez=all.filter(p=>inYear(p.dataBotez,y));
  const reprimiri=all.filter(p=>p.modIntrare==='Reprimire'&&inYear(p.dataMembru,y));
  const iesiri=all.filter(p=>inYear(p.dataIesire,y));
  const binecuv=all.filter(p=>inYear(p.dataBinecuvantare,y));
  const nunti=Object.values(S.events).filter(e=>e.tip==='Nuntă'&&inYear(e.data,y));
  const inmorm=Object.values(S.events).filter(e=>e.tip==='Înmormântare'&&inYear(e.data,y));
  const gen={M:ev.filter(p=>p.gen==='M').length,F:ev.filter(p=>p.gen==='F').length};
  const bands=[['0–17',0,17],['18–30',18,30],['31–45',31,45],['46–60',46,60],['61+',61,200]].map(([l,a,b])=>[l,ev.filter(p=>{const x=ageAt(p);return x!==null&&x>=a&&x<=b}).length]);
  const fams=new Set(ev.map(p=>p.familie).filter(Boolean)).size;
  return {y,endDate,ev,membri,copii,copiiMembri,apart,prieteni,botezati,intrTransfer,intrBotez,reprimiri,iesiri,binecuv,nunti,inmorm,gen,bands,fams};
}

  if(s.intrBotez.length)evs.push(`${s.intrBotez.length===1?'un botez nou-testamentar':'botezuri nou-testamentare'} (${n(s.intrBotez)})`);
  if(s.nunti.length)evs.push(`${s.nunti.length===1?'o nuntă':s.nunti.length+' nunți'} (${s.nunti.map(e=>e.titlu).join(', ')})`);
  if(s.inmorm.length)evs.push(`${s.inmorm.length===1?'o înmormântare':s.inmorm.length+' înmormântări'} (${s.inmorm.map(e=>e.titlu).join(', ')})`);
  if(evs.length)L.push(`În anul ${y} ${evs.length>1?'au avut loc':'a avut loc'}: ${evs.join('; ')}.`);
  if(s.iesiri.length)L.push(`Ieșiri din evidență în ${y}: ${s.iesiri.map(p=>`${memberName(p)} (${p.modIesire||'ieșire'}${p.bisericaDestinatie?', '+p.bisericaDestinatie:''})`).join(', ')}.`);
  const evY=Object.values(S.events).filter(e=>inYear(e.data,y));const sedY=Object.values(S.meetings).filter(m=>inYear(m.data,y));

  return L.join('\n');
}

  if(!val('m_nume')){toast('Numele este obligatoriu.');return}

  <div class="segs">${[['luna','Lună'],['viitoare','Viitoare'],['trecute','Trecute']].map(([k,l])=>`<button class="${evFilt===k?'on':''}" onclick="evFilt='${k}';render()">${l}</button>`).join('')}</div>`;
  const item=x=>{const [y,m,d]=(x.data||'---').split('-');const ag=x.agapa&&x.agapa.activ;
    return `<button class="item" onclick="showEvent('${x.id}')"><div class="date"><b>${+d||'?'}</b><span>${MONTHS[+m-1]||''} ${y||''}</span></div><div class="body"><div class="t">${esc(x.titlu)}</div><div class="m">${esc([x.ora,x.loc,x.invitat?'Invitat: '+x.invitat:''].filter(Boolean).join(' · '))}</div></div>${ag?`<span class="tag gold">Agapă ${(x.agapa.contributii||[]).length}</span>`:`<span class="tag">${esc(x.tip)}</span>`}</button>`};
  if(evFilt==='luna'){
    const first=new Date(calY,calM,1),start=(first.getDay()+6)%7,dim=new Date(calY,calM+1,0).getDate();
    const byDay={};Object.values(S.events).forEach(e=>{if(e.data)(byDay[e.data]=byDay[e.data]||[]).push(e)});
    Object.values(S.meetings).forEach(e=>{if(e.data)(byDay[e.data]=byDay[e.data]||[]).push({...e,_s:1})});
    let cells='';
    for(let i=0;i<start;i++)cells+='<div></div>';
    for(let d=1;d<=dim;d++){const ds=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const ev=byDay[ds]||[];
      cells+=`<button class="d ${ds===t?'today':''} ${ds===calSel?'sel':''}" onclick="calSel='${ds}';render()">${d}${ev.length?`<i>${ev.slice(0,3).map(()=>'<b></b>').join('')}</i>`:''}</button>`}
    html+=`<div class="calhead"><button class="btn sm ghost" onclick="calM--;if(calM<0){calM=11;calY--};render()">‹</button><h3>${MONTHS_L[calM][0].toUpperCase()+MONTHS_L[calM].slice(1)} ${calY}</h3><button class="btn sm ghost" onclick="calM++;if(calM>11){calM=0;calY++};render()">›</button></div>
    <div class="cal">${['L','Ma','Mi','J','V','S','D'].map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div>`;
    const sel=(byDay[calSel]||[]);
    html+=`<div class="letter">${fmt(calSel)}${canWrite?` <button class="btn sm ghost" onclick="openEvent('',{data:'${calSel}'})">+ adaugă</button>`:''}</div><div class="list">${sel.map(e=>e._s?`<button class="item" onclick="showMeeting('${e.id}')"><div class="body"><div class="t">${esc(e.titlu||e.tip)}</div><div class="m">Ședință${e.ora?' · '+esc(e.ora):''}</div></div><span class="tag">PV</span></button>`:item(e)).join('')||'<div class="hint" style="padding:12px 4px">Nimic în această zi.</div>'}</div>`;
    return html;
  }
  let all=Object.values(S.events);
  all=evFilt==='viitoare'?all.filter(e=>(e.data||'')>=t).sort((a,b)=>(a.data||'').localeCompare(b.data||'')):all.filter(e=>(e.data||'')<t).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  if(!all.length)return html+`<div class="empty"><h3>${evFilt==='viitoare'?'Nimic programat':'Niciun eveniment trecut'}</h3></div>`;

  if(!list.length)return html+`<div class="empty"><h3>Nicio mențiune</h3></div>`;
  return html+'<div class="list">'+list.map(n=>{const [y,m,d]=(n.data||'---').split('-');const who=S.members[n.persoanaId]?memberName(S.members[n.persoanaId]):n.familie?'Fam. '+n.familie:'General';
    return `<button class="item" onclick="showNote('${n.id}')"><div class="date"><b>${+d||'?'}</b><span>${MONTHS[+m-1]||''} ${y||''}</span></div><div class="body"><div class="t">${esc(who)}</div><div class="m">${esc(n.text)}</div></div><span class="tag">${esc(n.tip)}</span></button>`}).join('')+'</div>';
}
function showNote(id){const n=S.notes[id];if(!n)return;const who=S.members[n.persoanaId]?memberName(S.members[n.persoanaId]):n.familie?'Familia '+n.familie:'General';
  openSheet(who,`<dl class="detail"><dt>Data · tip</dt><dd>${fmt(n.data)} · ${esc(n.tip)}</dd><dt>Mențiune</dt><dd style="white-space:pre-wrap">${esc(n.text)}</dd></dl>`,
  `${canWrite?`<button class="btn danger" onclick="if(confirm('Ștergeți mențiunea?'))del('notes','${id}').then(closeSheet)">Șterge</button><div class="spacer"></div><button class="btn primary" onclick="openNote('${id}')">Editează</button>`:''}`)}
function openNote(id,pre){
  const n=id?S.notes[id]:{data:today(),tip:nomen('tipuriMentiuni')[0],...(pre||{})};
  const fams=[...new Set(Object.values(S.members).map(m=>m.familie).filter(Boolean))].sort();
  openSheet(id?'Editează mențiunea':'Mențiune nouă',`
  <div class="row2"><div class="f"><label>Data</label><input type="date" id="n_data" value="${esc(n.data)}"></div><div class="f"><label>Tip</label><select id="n_tip">${nomen('tipuriMentiuni').map(t=>`<option ${n.tip===t?'selected':''}>${t}</option>`).join('')}</select></div></div>
  <div class="row2"><div class="f"><label>Persoana</label><select id="n_p"><option value="">—</option>${membersSorted().map(m=>`<option value="${m.id}" ${n.persoanaId===m.id?'selected':''}>${esc(memberName(m))}</option>`).join('')}</select></div><div class="f"><label>sau familia</label><input id="n_f" list="famlist2" value="${esc(n.familie)}"><datalist id="famlist2">${fams.map(f=>`<option value="${esc(f)}">`).join('')}</datalist></div></div>
  <div class="f"><label>Mențiune</label><textarea id="n_text">${esc(n.text)}</textarea></div>`,
  `<div class="spacer"></div><button class="btn primary" onclick="saveNote('${id||''}')">Salvează</button>`);
}
async function saveNote(id){
  if(!val('n_text')){toast('Textul lipsește.');return}
  await put('notes',id||uid(),{data:val('n_data'),tip:val('n_tip'),persoanaId:val('n_p'),familie:val('n_f'),text:val('n_text'),createdAt:(id&&S.notes[id]&&S.notes[id].createdAt)||today()});closeSheet();toast('Salvat.');
}

/* ---------- Documents ---------- */
function vDocs(){
  const all=Object.values(S.documents).sort((a,b)=>(b.data||'').localeCompare(a.data||'')||(b.nr||0)-(a.nr||0));
  let html=`<div class="head"><div><h2>Documente</h2><div class="sub">Adeverințe, certificate, scrisori, dări de seamă — registru de ieșire</div></div>${writeBtn('+ Document','openDoc()')}</div>`;
  if(!all.length)return html+`<div class="empty"><h3>Registrul de ieșire e gol</h3>Generați o adeverință sau un certificat dintr-un șablon; datele se completează automat din registrul de persoane.</div>`;
  html+='<div class="list">';
  all.forEach(x=>{const [y,m,d]=(x.data||'---').split('-');
    html+=`<button class="item" onclick="showDoc('${x.id}')"><div class="date"><b>${+d||'?'}</b><span>${MONTHS[+m-1]||''} ${y||''}</span></div><div class="body"><div class="t">${esc(x.titlu||DTYPES[x.tip])}</div><div class="m">Nr. ${esc(x.nr)}/${y||''} · ${esc(x.persoana||x.catre||'')}</div></div><span class="tag">${esc((DTYPES[x.tip]||x.tip).split(' ')[0])}</span></button>`});
  return html+'</div>';
}
function nextNr(){const y=today().slice(0,4);return Object.values(S.documents).filter(d=>(d.data||'').startsWith(y)).reduce((m,d)=>Math.max(m,+d.nr||0),0)+1}
function showDoc(id){
  const x=S.documents[id];if(!x)return;
  openSheet(x.titlu||DTYPES[x.tip],`<dl class="detail"><dt>Număr / dată</dt><dd>Nr. ${esc(x.nr)} din ${fmt(x.data)}</dd>${x.persoana?`<dt>Persoana</dt><dd>${esc(x.persoana)}</dd>`:''}${x.catre?`<dt>Către</dt><dd>${esc(x.catre)}</dd>`:''}<dt>Conținut</dt><dd style="white-space:pre-wrap;font-family:var(--serif)">${esc(x.text)}</dd></dl>`,
  `${canWrite?`<button class="btn danger" onclick="if(confirm('Ștergeți documentul din registru?'))del('documents','${id}').then(closeSheet)">Șterge</button>`:''}<div class="spacer"></div><button class="btn" onclick="printDoc('${id}')">Tipărește</button>${canWrite?`<button class="btn primary" onclick="openDoc('${id}')">Editează</button>`:''}`);
}
function openDoc(id,pre){
  const x=id?S.documents[id]:{tip:'adeverinta',data:today(),nr:nextNr(),...(pre||{})};
  const ms=membersSorted();
  openSheet(id?'Editează documentul':'Document nou',`
  <div class="row2"><div class="f"><label>Tip</label><select id="d_tip" onchange="genDocText(true)">${Object.entries(DTYPES).map(([k,v])=>`<option value="${k}" ${x.tip===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="f"><label>Nr. / data</label><div style="display:flex;gap:6px"><input type="number" id="d_nr" value="${esc(x.nr)}" style="width:80px"><input type="date" id="d_data" value="${esc(x.data)}"></div></div></div>
  <div class="f"><label>Persoana (din registru)</label><select id="d_mb" onchange="genDocText(true)"><option value="">— fără —</option>${ms.map(m=>`<option value="${m.id}" ${x.membruId===m.id?'selected':''}>${esc(memberName(m))}</option>`).join('')}</select></div>
  <div class="row2"><div class="f"><label>Către / destinatar</label><input id="d_catre" value="${esc(x.catre)}" placeholder="ex. Biserica Betel Oslo" onchange="genDocText(true)"></div><div class="f"><label>Scop / subiect</label><input id="d_scop" value="${esc(x.scop)}" placeholder="ex. a-i servi la …" onchange="genDocText(true)"></div></div>
  <div class="f"><label>Titlu în registru</label><input id="d_titlu" value="${esc(x.titlu)}"></div>
  <div class="f"><label>Conținut <span class="hint" style="display:inline">(generat din datele introduse; poate fi modificat)</span></label><textarea id="d_text" style="min-height:240px;font-family:var(--serif)">${esc(x.text)}</textarea><button class="btn sm ghost" type="button" onclick="genDocText(true,true)">Regenerează din șablon</button></div>`,
  `<div class="spacer"></div><button class="btn" onclick="previewDoc()">Previzualizare / tipărire</button><button class="btn primary" onclick="saveDoc('${id||''}')">Salvează</button>`);
  $('#d_text').dataset.an=x.an||'';
  if(!id&&!x.text)genDocText(true);
}
function genDocText(auto,force){
  const ta=$('#d_text');if(!ta)return;
  if(ta.value.trim()&&!force&&ta.dataset.touched)return;
  const c=S.settings,tip=val('d_tip'),m=S.members[val('d_mb')],catre=val('d_catre'),scop=val('d_scop');
  const f=m&&m.gen==='F';const nume=m?memberName(m):'____________________';
  const nascut=m&&m.dataNasterii?`, născut${f?'ă':''} la data de ${fmtL(m.dataNasterii)}`:'';
  const bis=`Biserica ${c.nume||'____________'}`;
  const parinti=m&&m.familie?Object.values(S.members).filter(p=>p.familie===m.familie&&['Cap de familie','Soție','Părinte'].includes(p.rudenie)).map(memberName).join(' și '):'';
  const T={
    adeverinta:`${bis}, cu sediul în ${c.adresa||'____________'}, adeverește prin prezenta că ${nume}${nascut}, este membr${f?'ă':'u'} al bisericii noastre${m&&m.dataMembru?' din data de '+fmtL(m.dataMembru):''}${m&&m.dataBotez?', fiind botezat'+(f?'ă':'')+' în apă la data de '+fmtL(m.dataBotez):''}.\n\nPrezenta adeverință se eliberează la cererea ${f?'dânsei':'dânsului'}, pentru ${scop||'a-i servi la cele legale'}.`,
    botez:`Se certifică prin prezenta că ${nume}${nascut}, a fost botezat${f?'ă':''} în apă, prin cufundare, în Numele Tatălui, al Fiului și al Sfântului Duh, la data de ${m&&m.dataBotez?fmtL(m.dataBotez):'____________'}${m&&m.locBotez?', la '+m.locBotez:''}, în cadrul ${bis}.\n\nPrezentul certificat se eliberează pentru ${scop||'a-i servi la cele de trebuință'}.`,
    binecuvantare:`Se certifică prin prezenta că ${f?'copila':'copilul'} ${nume}${nascut}${parinti?', din părinții '+parinti:''}, a fost adus${f?'ă':''} înaintea Domnului și binecuvântat${f?'ă':''} în cadrul ${bis}, la data de ${m&&m.dataBinecuvantare?fmtL(m.dataBinecuvantare):'____________'}.\n\n„Lăsați copilașii să vină la Mine și nu-i opriți, căci Împărăția lui Dumnezeu este a celor ca ei.” (Marcu 10:14)`,
    recomandare:`Către ${catre||'____________________'},\n\nHar și pace de la Dumnezeu, Tatăl nostru, și de la Domnul Isus Hristos!\n\n${bis} recomandă cu drag pe ${f?'sora':'fratele'} ${nume}${nascut}, membr${f?'ă':'u'} al bisericii noastre${m&&m.dataMembru?' din '+fmtL(m.dataMembru):''}${m&&m.dataBotez?', botezat'+(f?'ă':'')+' în apă la '+fmtL(m.dataBotez):''}, care ${scop||'se mută în localitatea dumneavoastră'}. ${f?'Sora':'Fratele'} a avut o purtare frumoasă și o mărturie bună în mijlocul nostru și nu are datorii sau abateri de disciplină față de biserică.\n\nVă rugăm să ${f?'o':'îl'} primiți în părtășia frățească și să-i acordați toată dragostea în Domnul.\n\nCu salutări frățești,`,
    scrisoare:`Către ${catre||'____________________'},\n\n${scop?'Ref.: '+scop+'\n\n':''}`,
    raport:reportText(+(ta.dataset.an||val('d_data').slice(0,4)))
  };
  ta.value=T[tip]||'';ta.dataset.touched='';
  const titlu=$('#d_titlu');if(titlu&&(!titlu.value||force))titlu.value=`${DTYPES[tip]}${m?' — '+memberName(m):catre?' — '+catre:''}`;
  ta.addEventListener('input',()=>ta.dataset.touched='1',{once:true});
}
function docHtml(x){
  const c=S.settings;
  const heading={adeverinta:'Adeverință',botez:'Certificat de botez',binecuvantare:'Certificat de binecuvântare',recomandare:'Scrisoare de recomandare',scrisoare:'',raport:'Dare de seamă anuală'}[x.tip]||'';
  const sig=x.tip==='raport'?`<div class="sig"><div>Secretar<span>${esc(c.secretar||'')}</span></div><div>Pastor<span>${esc(c.pastor||'')}</span></div></div>`:`<div class="sig"><div>Pastor<span>${esc(c.pastor||'')}</span></div><div>Secretar<span>${esc(c.secretar||'')}</span></div></div>`;
  return `${letterhead()}<div class="nr">Nr. ${esc(x.nr)} din ${fmtL(x.data)}</div>${heading?`<h2>${heading}</h2>`:''}<p class="pre">${esc(x.text)}</p>${sig}`;
}
function previewDoc(){$('#print').innerHTML=docHtml({tip:val('d_tip'),nr:val('d_nr'),data:val('d_data'),text:val('d_text')});window.print()}
async function saveDoc(id){
  const m=S.members[val('d_mb')];
  const d={tip:val('d_tip'),nr:+val('d_nr')||0,data:val('d_data'),membruId:val('d_mb'),persoana:m?memberName(m):'',catre:val('d_catre'),scop:val('d_scop'),titlu:val('d_titlu'),text:val('d_text'),an:$('#d_text').dataset.an||'',createdAt:(id&&S.documents[id]&&S.documents[id].createdAt)||today()};
  if(!d.text){toast('Conținutul lipsește.');return}
  await put('documents',id||uid(),d);closeSheet();toast('Înregistrat în registru.');
}
function printDoc(id){$('#print').innerHTML=docHtml(S.documents[id]);window.print()}
function letterhead(){const c=S.settings;return `<div class="letterhead"><h1>Biserica ${esc(c.nume||'')}</h1><div>${esc([c.adresa,c.orgnr?'Org.nr. '+c.orgnr:'',c.telefon,c.email].filter(Boolean).join(' · '))}</div></div>`}

/* ---------- Settings ---------- */
function vSettings(){
  const c=S.settings;
  const nom=(k,l)=>`<div class="f"><label>${l}</label><textarea id="nm_${k}" style="min-height:80px">${esc(nomen(k).join('\n'))}</textarea></div>`;
  return `<div class="head"><div><h2>Setări</h2><div class="sub">Organizația, semnături, nomenclatoare</div></div></div>
  <div class="card"><h3>Organizația</h3>
  <div class="f"><label>Numele bisericii</label><input id="c_nume" value="${esc(c.nume)}" placeholder="ex. Maranata Stavanger"></div>
  <div class="f"><label>Adresă</label><input id="c_adresa" value="${esc(c.adresa)}"></div>
  <div class="row2"><div class="f"><label>Org.nr. / cod fiscal</label><input id="c_orgnr" value="${esc(c.orgnr)}"></div><div class="f"><label>Telefon</label><input id="c_tel" value="${esc(c.telefon)}"></div></div>
  <div class="f"><label>E-mail</label><input id="c_email" value="${esc(c.email)}"></div>
  <div class="row2"><div class="f"><label>Pastor</label><input id="c_pastor" value="${esc(c.pastor)}"></div><div class="f"><label>Secretar</label><input id="c_sec" value="${esc(c.secretar)}"></div></div></div>
  <div class="card"><h3>Nomenclatoare</h3><div class="hint" style="margin-bottom:10px">Câte o valoare pe linie.</div>
  ${nom('tipuriSedinte','Tipuri de ședințe')}${nom('tipuriEvenimente','Tipuri de evenimente')}${nom('tipuriMentiuni','Tipuri de mențiuni')}${nom('rudenie','Grade de rudenie')}</div>
  ${canWrite?`<button class="btn primary" onclick="saveSettings()">Salvează setările</button>`:''}
  <div class="card" style="margin-top:28px"><h3>Copie de siguranță</h3><div class="hint">Exportă toate datele într-un fișier JSON, sau importă un fișier salvat anterior.</div>
  <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn" onclick="exportData()">Exportă</button>${canWrite?`<label class="btn" style="cursor:pointer">Importă<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label>`:''}</div></div>
  <div class="card"><h3>Aspect</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" onclick="setTheme('')">Automat</button><button class="btn sm" onclick="setTheme('light')">Luminos</button><button class="btn sm" onclick="setTheme('dark')">Întunecat</button></div></div>
  <div class="hint" style="margin-top:20px">${db?'Datele sunt partajate cu toți cei care au acces la această pagină în organizația dumneavoastră.':'Această pagină funcționează fără bază de date: datele rămân doar în acest browser. Faceți periodic o copie de siguranță.'}</div>`;
}
async function saveSettings(){
  const lines=k=>val('nm_'+k).split('\n').map(s=>s.trim()).filter(Boolean);
  await putSettings({nume:val('c_nume'),adresa:val('c_adresa'),orgnr:val('c_orgnr'),telefon:val('c_tel'),email:val('c_email'),pastor:val('c_pastor'),secretar:val('c_sec'),nomen:{tipuriSedinte:lines('tipuriSedinte'),tipuriEvenimente:lines('tipuriEvenimente'),tipuriMentiuni:lines('tipuriMentiuni'),rudenie:lines('rudenie')}});toast('Setări salvate.');
}
function setTheme(t){try{if(t){document.documentElement.dataset.theme=t;localStorage.setItem('sb-theme',t)}else{delete document.documentElement.dataset.theme;localStorage.removeItem('sb-theme')}}catch(e){}}
try{const t=localStorage.getItem('sb-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
async function exportData(){
  const json=JSON.stringify(S,null,2);const name=`secretariat-${(S.settings.nume||'biserica').replace(/\s+/g,'-').toLowerCase()}-${today()}.json`;
  let dl=null;try{dl=await claude.use('downloads')}catch(e){}
  if(dl){try{await dl.save({filename:name,data:json});toast('Export pregătit.');return}catch(e){if(e&&e.code==='cancelled')return}}
  try{await navigator.clipboard.writeText(json);toast('Datele au fost copiate în clipboard (JSON).')}catch(e){prompt('Copiați datele:',json)}
}
async function importData(inp){
  const f=inp.files[0];if(!f)return;
  try{const j=JSON.parse(await f.text());let n=0;
    for(const c of COLS){for(const [id,d] of Object.entries(j[c]||{})){await put(c,id,d);n++}}
    if(j.settings&&Object.keys(j.settings).length)await putSettings(j.settings);
    toast(`Importate ${n} înregistrări.`)}catch(e){toast('Fișier invalid.')}
  inp.value='';
}

/* ---------- Sheet ---------- */
function openSheet(title,body,foot){$('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=body;$('#sheetFoot').innerHTML=foot||'';$('#sheet').classList.add('open');$('#sheetBg').classList.add('open');$('#sheetBody').scrollTop=0}
function closeSheet(){$('#sheet').classList.remove('open');$('#sheetBg').classList.remove('open')}
$('#sheetClose').onclick=closeSheet;$('#sheetBg').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

initStore();
</script>
</body>
</html>
