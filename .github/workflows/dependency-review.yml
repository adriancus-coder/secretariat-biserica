name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: New dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails a pull request that adds a dependency with a known high or critical vulnerability.
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
