name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificare:
    name: Lint, tipuri, teste, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: secretariat
          POSTGRES_PASSWORD: secretariat
          POSTGRES_DB: secretariat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secretariat -d secretariat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://secretariat:secretariat@localhost:5432/secretariat_test?schema=public
      TEST_DATABASE_URL: postgresql://secretariat:secretariat@localhost:5432/secretariat_test?schema=public
      AUTH_SECRET: ci-doar-pentru-teste-0123456789abcdef
      AUTH_TRUST_HOST: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalare dependențe
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Verificarea tipurilor
        run: npm run typecheck
      - name: Teste (unitare + integrare pe PostgreSQL)
        run: npm test
      - name: Build de producție
        run: npm run build
