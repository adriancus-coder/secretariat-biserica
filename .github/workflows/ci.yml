name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: secretariat
          POSTGRES_PASSWORD: secretariat
          POSTGRES_DB: secretariat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secretariat -d secretariat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://secretariat:secretariat@localhost:5432/secretariat_test?schema=public
      TEST_DATABASE_URL: postgresql://secretariat:secretariat@localhost:5432/secretariat_test?schema=public
      AUTH_SECRET: ci-doar-pentru-teste-0123456789abcdef
      AUTH_TRUST_HOST: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # No high or critical npm audit finding, except time-limited entries in audit-allowlist.json.
      - name: npm audit (high and critical)
        run: npm run audit:check
      # The same command every commit must pass locally: lint, typecheck, unit + integration tests, build.
      - name: npm run check
        run: npm run check
